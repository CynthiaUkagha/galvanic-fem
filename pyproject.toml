[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "galvanicfem"
version = "0.1.0"
description = "How far does zinc protect a scratch in galvanized steel? A small, verified finite-element model."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Onyinye Ukagha"}]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["galvanicfem"]
